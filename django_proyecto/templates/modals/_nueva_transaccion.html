<div class="modal fade modal-minimal" id="nuevaTransaccionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-semibold">Nueva transacción</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="formTransaccion">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="fechaTransaccion" class="form-label small text-muted">Fecha *</label>
                            <input type="date" class="form-control" id="fechaTransaccion" required>
                        </div>
                        <div class="col-md-6">
                            <label for="numeroTransaccion" class="form-label small text-muted">No. transacción</label>
                            <input type="text" class="form-control" id="numeroTransaccion" readonly>
                        </div>
                        <div class="col-12">
                            <label for="descripcion" class="form-label small text-muted">Descripción *</label>
                            <textarea class="form-control" id="descripcion" rows="2" required></textarea>
                        </div>
                    </div>

                    <p class="seccion-titulo mt-4 mb-2">Cuentas afectadas</p>
                    <div id="cuentasContainer">
                        <div class="row g-2 mb-2 cuenta-fila">
                            <div class="col-md-5">
                                <select class="form-select form-select-sm select-cuenta" required>
                                    <option value="">Seleccionar cuenta...</option>
                                    {% for cuenta in cuentas %}
                                    <option value="{{ cuenta.id }}" data-tipo="{{ cuenta.tipo }}">
                                        {{ cuenta.codigo }} - {{ cuenta.nombre }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select class="form-select form-select-sm tipo-movimiento" required>
                                    <option value="">Tipo...</option>
                                    <option value="debe">DEBE</option>
                                    <option value="haber">HABER</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control form-control-sm monto" step="0.01" min="0"
                                       placeholder="0.00" required>
                            </div>
                            <div class="col-md-1 d-flex align-items-center">
                                <button type="button" class="btn btn-link text-danger btn-sm p-0 quitar-cuenta" disabled>
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-link btn-sm px-0" id="agregarCuenta">
                        <i class="bi bi-plus me-1"></i>Agregar otra cuenta
                    </button>

                    <div class="row g-3 mt-2">
                        <div class="col-md-6">
                            <div class="resumen-balance">
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Total debe</span>
                                    <strong id="totalDebe">$ 0.00</strong>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Total haber</span>
                                    <strong id="totalHaber">$ 0.00</strong>
                                </div>
                                <hr class="my-2">
                                <div class="d-flex justify-content-between">
                                    <span class="text-muted">Diferencia</span>
                                    <strong id="diferencia" class="text-success">$ 0.00</strong>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 d-flex align-items-center">
                            <div id="estadoBalance" class="alert alert-warning mb-0 w-100 small">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                <span>Transacción desbalanceada</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primario" id="btnGuardar" disabled>
                        <i class="bi bi-check-lg me-1"></i>Guardar transacción
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
