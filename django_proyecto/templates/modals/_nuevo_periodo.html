<div class="modal fade modal-minimal" id="nuevoPeriodoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-semibold">Nuevo periodo contable</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form method="post" action="{% url 'crear_periodo_contable' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="año" class="form-label small text-muted">Año *</label>
                        <input type="number" class="form-control" id="año" name="año"
                               value="{% now 'Y' %}" min="2021" max="{% now 'Y' %}" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label for="fecha_inicio" class="form-label small text-muted">Fecha inicio *</label>
                            <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
                        </div>
                        <div class="col-6">
                            <label for="fecha_fin" class="form-label small text-muted">Fecha fin *</label>
                            <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primario">Crear periodo</button>
                </div>
            </form>
        </div>
    </div>
</div>
