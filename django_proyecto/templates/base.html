{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de rendimiento{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/sidebar.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar navbar-dark custom-navbar">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center">
                <!-- Botón del sidebar (solo en pantallas pequeñas) -->
                <button class="btn btn-outline-light d-lg-none me-3" type="button"
                        data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                    <i class="bi bi-list"></i>
                </button>

                <a class="navbar-brand d-flex align-items-center" href="{% url 'menu_conta' %}">
                    <img src="{% static 'image/logo_technova.jpg' %}" alt="Logo" width="40" height="40" class="me-2">
                    <span class="fs-4 fw-bold">Technova</span>
                </a>
            </div>

            <form method="POST" action="{% url 'logout' %}" class="d-flex">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light d-flex align-items-center">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
                </button>
            </form>
        </div>
    </nav>

    <div class="d-flex">
        {% include 'partials/sidebar.html' %}

        <main class="flex-grow-1 p-4">
            {% include 'alertas.html' %}
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <footer>
        {% block footer_scripts %}
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="{% static 'js/popper.min.js' %}"></script>
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.js"></script>
        <script src="{% static 'js/sidebar.js' %}"></script>
        {% endblock %}
    </footer>

</body>

</html>
