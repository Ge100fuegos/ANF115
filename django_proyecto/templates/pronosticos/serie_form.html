{% extends 'base.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ titulo }}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
    .contenedor { max-width: 700px; margin: 30px auto; background: #fff; padding: 24px 30px;
                  border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    form p { margin: 0 0 14px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    .helptext { display: block; font-size: 12px; color: #6b7280; margin-top: 3px; }
    .errorlist { color: #dc2626; margin: 0 0 6px; padding-left: 18px; font-size: 13px; }
    .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; text-decoration: none;
           border: none; cursor: pointer; font-size: 14px; }
    .btn-primario { background: #2563eb; color: #fff; }
    .btn-gris { background: #6b7280; color: #fff; }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>{{ titulo }}</h1>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primario">Guardar</button>
      <a class="btn btn-gris" href="{% url 'pronostico_lista' %}">Cancelar</a>
    </form>
  </div>
</body>
</html>
{% endblock %}
